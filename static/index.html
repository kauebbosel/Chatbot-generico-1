<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Teste Integração PAR-PROCEL</title>
    <link rel="stylesheet" href="css/toasts.css">
</head>
<body>
    <h1>Dashboard do Projeto</h1>
    <p>O sistema está verificando novas notificações no servidor Python a cada 10 segundos...</p>

    <div id="toast-wrapper"></div>

    <script src="js/ui.js"></script>

    <script>
        async function fetchNotifications() {
            try {
                console.log("Buscando notificações no servidor...");
                const response = await fetch('http://localhost:8000/api/v1/toasts/pendentes');
                if (response.ok) {
                    const data = await response.json();
                    renderToast(data); // Chama a função do ui.js
                }
            } catch (error) {
                console.error("Servidor de teste desligado. Rode o servidor_teste.py");
            }
        }

        // Inicia a verificação automática
        setInterval(fetchNotifications, 10000);
    </script>
</body>
</html>
